<script>

          // (1) viewport 너비 부족: c.width + 좌우 margin 16px*2 가 innerWidth 를 넘는 경우
          var vw = (typeof window !== 'undefined' && window.innerWidth) ? window.innerWidth : c.width;
          var avail = vw - 32;
          if (avail > 0 && c.width > avail) scale = avail / c.width;
          // (2) 텍스트 overflow: nowrap 텍스트가 padding 안쪽 너비를 초과 (로컬라이징 케이스)
          //     scrollWidth(텍스트 실제 너비) > clientWidth(컨테이너 안쪽 너비) 면 비율로 축소
          if (t.scrollWidth > t.clientWidth + 1 && t.clientWidth > 0) {
            var textScale = t.clientWidth / t.scrollWidth;
            if (textScale < scale) scale = textScale;
          }
          if (scale < 1) {
            if (scale < c.minScale) scale = c.minScale;
            t.style.transform = 'translateX(-50%) scale(' + scale + ')';
          }
        }

        var rAF2 = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : function (cb) { return setTimeout(cb, 16); };
        rAF2(function () { rAF2(function () { t.style.opacity = '1'; }); });
        setTimeout(function () { t.style.opacity = '0'; }, Math.max(0, c.durationMs - 300));
        setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, c.durationMs + 50);
      } catch (e) {}
    };

    // 스플래시 종료 직후 1회 표시, durationMs 내 fade-out & 제거.
    // 데이터 요금 안내 전용 가드: 중복 방지 + OAuth 콜백 스킵.
    function _showDataFeeToast() {
      try {
        var c = DATA_FEE_TOAST;
        if (!c || !c.text) return;
        if (window.__dataFeeToastShown) return;
        // OAuth 콜백(?code=) 로드는 GNB 표시용 clean-URL reload 예정 → reload 후 깨끗한 로드에서 표시.
        if (/[?&]code=/i.test(location.search || '')) return;
        window.__dataFeeToastShown = true;
        window.__showKakaoToast(c.text, c);
      } catch (e) {}
    }

    function _actuallyHide() {
      if (!splash || splash.dataset.hidden) return;
      splash.dataset.hidden = '1';
      // 1) 로고 fade-out — ready 클래스 제거 → IMG opacity 1 → 0 (600ms ease-out)
      //    배경은 transition 없이 끝까지 유지 (사용자 의도)
      splash.classList.add('kakao-splash-hide');   /* pointer-events 만 차단, opacity 변경 X */
      splash.classList.remove('kakao-splash-ready');
      // 2) 로고 fade-out 끝난 직후 splash 자체를 일순간에 DOM 제거 (배경도 같이 사라짐)
      setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
        _showDataFeeToast();   // 스플래시 종료 직후 데이터 요금 안내 토스트
      }, 620);   // CSS transition 600ms + 약간의 여유
    }

    window.__hideKakaoSplash = function () {
      if (!splash || splash.dataset.hidden || pendingTimer) return;
      var elapsed = Date.now() - startedAt;
      var remaining = Math.max(0, MIN_DISPLAY_MS - elapsed);
      if (remaining > 0) {
        pendingTimer = setTimeout(function () { pendingTimer = null; _actuallyHide(); }, remaining);
      } else {
        _actuallyHide();
      }
    };

    // 안전 타임아웃 — 30초 동안 hide 호출 없으면 강제 숨김
    setTimeout(function () {
      if (typeof window.__hideKakaoSplash === 'function') window.__hideKakaoSplash();
    }, 30000);
  })();
</script>
