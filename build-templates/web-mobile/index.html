<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, minimum-scale=1, maximum-scale=1, minimal-ui=true"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">
    <meta name="x5-orientation" content="landscape">
    <meta name="renderer" content="webkit">
    <meta name="force-rendering" content="webkit">
    <meta name="xx-ua-compatible" content="IE=edge,chrome=1">
    <meta name="msapplication-tap-highlight" content="no">
    <!-- Cache Control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>49FriendsRunner v0.1.10</title>
    <script>
        // 부모 페이지 제목 변경 (iframe 내에서 로드될 때)
        try {
            var gameTitle = '49FriendsRunner v0.1.10';
            document.title = gameTitle;
            if (window.parent && window.parent !== window) {
                window.parent.document.title = gameTitle;
            }
        } catch (e) {}
    </script>

    <!-- Hi5 SDK Real Parent Saving (MUST be first, before Cocos overwrites window.parent) -->
    <script type="text/javascript">
        // 실제 window.parent 저장 (Cocos Creator가 덮어씌우기 전에!)
        // Cocos Creator는 런타임에 window.parent를 cc_Scene 객체로 덮어씌움
        // 이 코드는 가장 먼저 실행되어야 함
        (function() {
            if (window.parent && typeof window.parent.postMessage === 'function') {
                window._hi5RealParent = window.parent;
                console.log('[Hi5] Real window.parent saved in index.html');
            } else {
                console.log('[Hi5] window.parent not available in index.html');
            }
        })();
    </script>

    <!--
    SPLASH FLOW 설명:
    Hi5 SDK 스플래시 → (HTML 스플래시 건너뜀) → 코코스 Loading 씬 (GameLoading.prefab)

    HTML 스플래시는 display:none으로 비활성화됨.
    Hi5.LoadEnd() 호출 시 Hi5 SDK 스플래시가 닫히고 바로 코코스 Loading 씬이 표시됨.
    코코스 Loading 씬의 GameLoading.prefab이 실제 로딩 프로그레스를 보여줌.
    -->

    <!-- Hi5 SDK Polyfill (must be before any Hi5 SDK scripts) -->
    <script type="text/javascript">
        // uni.$HI5 polyfill for web environment
        window.uni = window.uni || {};
        window.uni.$HI5 = window.uni.$HI5 || {
            hideLoading: function() { console.log('[Hi5 Polyfill] hideLoading called'); },
            showLoading: function() { console.log('[Hi5 Polyfill] showLoading called'); }
        };
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #GameCanvas {
            width: 100%;
            height: 100%;
        }
        #splash {
            /* HTML 스플래시 비활성화 - Hi5 SDK → 코코스 Loading 씬으로 직접 전환 */
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress-bar span {
            display: block;
            width: 0%;
            height: 100%;
            background: #4CAF50;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
<!-- BEGIN kakao-splash (hi5-sdk) -->
<style id="kakao-splash-style">
  #kakao-splash {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ffffff;   /* light: 흰 배경 — fade 없음, 끝까지 유지 후 즉시 제거 */
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-color-scheme: dark) {
    #kakao-splash { background-color: #000000; }   /* dark: 검은 배경 */
  }
  #kakao-splash.kakao-splash-hide { pointer-events: none; }
  #kakao-splash img {
    max-width: 60vw;
    max-height: 40vh;
    object-fit: contain;
    opacity: 0;                              /* 로고는 0 으로 시작 (fade-in 대기) */
    transition: opacity 600ms ease-out;      /* fade-in / fade-out 양쪽 모두 600ms (ready 클래스 토글) */
    will-change: opacity;
  }
  #kakao-splash.kakao-splash-ready img { opacity: 1; }   /* fade-in: ready 추가, fade-out: ready 제거 */
  #kakao-splash.kakao-splash-disabled { display: none !important; }
</style>
<!-- 카카오 SDK 가 띄우는 모달(GNB 오버레이) 텍스트 정렬 보정 — 카카오 측 요청.
     게임 body 의 text-align 상속을 막아 SDK 모달이 항상 왼쪽 정렬되도록. -->
<style id="kakao-sdk-overlay-fix">
  #sdk-gnb-overlay { text-align: left; }
</style>
<div id="kakao-splash" aria-hidden="true">
  <picture>
    <!-- dark mode: 검은 배경 + 흰 로고 -->
    <source srcset="splash/white.png" media="(prefers-color-scheme: dark)">
    <!-- light mode (기본): 흰 배경 + 검은 로고 -->
    <img src="splash/black.png" alt="" onerror="this.style.display='none'">
  </picture>
</div>
<script>
  (function () {
    var splash = document.getElementById('kakao-splash');
    if (!splash) return;
    var ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
    var qs = (typeof location !== 'undefined' && location.search) || '';
    var host = (typeof location !== 'undefined' && location.hostname) || '';
    var isKakao =
        /KAKAOTALK/i.test(ua) ||
        /game\.kakao\.com$/i.test(host) ||         /* dev-gameplay.game.kakao.com / qa-gameplay.game.kakao.com / gameplay.game.kakao.com */
        /[?&]provider=kakao\b/i.test(qs) ||
        /[?&]kakaoH5Id=/i.test(qs) ||
        /[?&]h5Id=/i.test(qs) ||
        /[?&]code=/i.test(qs);                     /* OAuth callback (?code=...&state=...) — provider 누락된 redirect 직후도 카카오로 인정 */
    if (!isKakao) { splash.className = 'kakao-splash-disabled'; return; }

    // 로고 fade-in — 한 frame 뒤에 ready 클래스 추가 → CSS transition 작동
    var rAF = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : function (cb) { return setTimeout(cb, 16); };
    rAF(function () { rAF(function () { splash.classList.add('kakao-splash-ready'); }); });

    // 표시 시작 시각 + 최소 표시 시간 (ms)
    var startedAt = Date.now();
    var MIN_DISPLAY_MS = 3000;
    var pendingTimer = null;

    function _actuallyHide() {
      if (!splash || splash.dataset.hidden) return;
      splash.dataset.hidden = '1';
      // 1) 로고 fade-out — ready 클래스 제거 → IMG opacity 1 → 0 (600ms ease-out)
      //    배경은 transition 없이 끝까지 유지 (사용자 의도)
      splash.classList.add('kakao-splash-hide');   /* pointer-events 만 차단, opacity 변경 X */
      splash.classList.remove('kakao-splash-ready');
      // 2) 로고 fade-out 끝난 직후 splash 자체를 일순간에 DOM 제거 (배경도 같이 사라짐)
      setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 620);   // CSS transition 600ms + 약간의 여유
    }

    window.__hideKakaoSplash = function () {
      if (!splash || splash.dataset.hidden || pendingTimer) return;
      var elapsed = Date.now() - startedAt;
      var remaining = Math.max(0, MIN_DISPLAY_MS - elapsed);
      if (remaining > 0) {
        pendingTimer = setTimeout(function () { pendingTimer = null; _actuallyHide(); }, remaining);
      } else {
        _actuallyHide();
      }
    };

    // 안전 타임아웃 — 30초 동안 hide 호출 없으면 강제 숨김
    setTimeout(function () {
      if (typeof window.__hideKakaoSplash === 'function') window.__hideKakaoSplash();
    }, 30000);
  })();
</script>
<!-- END kakao-splash (hi5-sdk) -->
    <!-- Loading Splash Screen -->
    <div id="splash">
        <div class="spinner"></div>
        <div class="progress-bar"><span id="progress"></span></div>
    </div>

    <!-- Game Canvas Container (required by Cocos main.js) -->
    <div id="GameDiv" style="width: 100%; height: 100%;">
        <div id="Cocos2dGameContainer" style="width: 100%; height: 100%;">
            <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
        </div>
    </div>

    <!-- Cocos Engine -->
    <script src="src/settings.js" charset="utf-8"></script>
    <script src="cocos2d-js.js" charset="utf-8"></script>
    <script src="main.js" charset="utf-8"></script>

    <script type="text/javascript">
        // Boot Cocos Engine (IMPORTANT: This must be called!)
        if (!window.jsb && window.boot) {
            window.boot();
        }
    </script>

    <script type="text/javascript">
        // Title Update - GameVersion 로드 후 최신 버전으로 갱신
        (function() {
            window.addEventListener('load', function() {
                setTimeout(function() {
                    if (window.GameVersion) {
                        var title = window.GameVersion.projectName + ' v' + window.GameVersion.version;
                        document.title = title;
                        // iframe 내에서 실행 시 부모 페이지 제목도 갱신
                        try {
                            if (window.parent && window.parent !== window) {
                                window.parent.document.title = title;
                            }
                        } catch (e) {}
                        console.log('[Title] Updated to: ' + title);
                    }
                }, 500);
            });
        })();
    </script>

    <script type="text/javascript">
        // Splash Screen - HTML 스플래시는 비활성화됨
        // Hi5 SDK 스플래시 → 코코스 Loading 씬으로 직접 전환
        (function() {
            // HTML 스플래시는 display:none으로 비활성화되어 있음
            // 아래 함수들은 호환성을 위해 유지 (호출해도 아무 동작 안함)

            // Update progress bar from Cocos (코코스 LoadingSceneBase에서 호출)
            window.updateGameProgress = function(percent) {
                // HTML 스플래시가 비활성화되어 있으므로 실제 동작 없음
                // 프로그레스는 코코스 Loading 씬의 GameLoading.prefab에서 표시
            };

            // 레거시 호환성을 위한 빈 함수 - 호출해도 아무 동작 안함
            function hideSplash() {
                // HTML 스플래시가 이미 display:none이므로 아무 동작 불필요
            }

            // 이벤트 리스너 유지 (호환성)
            document.addEventListener('gameReady', hideSplash);
            window.addEventListener('cc-game-ready', hideSplash);
        })();
    </script>

</body>
</html>
